<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- Technical Blueprint Gradients -->
    <linearGradient id="blueprint-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="50%" stop-color="#07111e"/>
      <stop offset="100%" stop-color="#040b15"/>
    </linearGradient>

    <linearGradient id="chassis-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14263f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1b2d" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="lidar-cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#46dbff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#46dbff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="wheel-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3250"/>
      <stop offset="50%" stop-color="#2a4c77"/>
      <stop offset="100%" stop-color="#12243b"/>
    </linearGradient>

    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#254366" stroke-width="0.8" opacity="0.35"/>
      <circle cx="0" cy="0" r="1" fill="#46dbff" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Technical Canvas Base -->
  <rect width="900" height="600" fill="url(#blueprint-bg)"/>
  <rect width="900" height="600" fill="url(#grid-pattern)"/>

  <!-- Outer Blueprint Border & Coordinate Markers -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#2a4e75" stroke-width="1.2" opacity="0.75"/>
  <rect x="30" y="30" width="840" height="540" fill="none" stroke="#1d3855" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Blueprint Header Annotations -->
  <g font-family="'DM Mono', monospace" fill="#6ba8d9">
    <text x="45" y="55" font-size="10" letter-spacing="2">PROJECT: COLUMBUS MAXIMUS // SPEC NO. R-001</text>
    <text x="45" y="70" font-size="8.5" fill="#4a769e" letter-spacing="1.5">SYSTEM: DIFFERENTIAL-DRIVE INDOOR AUTONOMOUS ROVER</text>
    <text x="45" y="83" font-size="8" fill="#3c6082" letter-spacing="1">ARCH: DUAL-TIER (ROS 2 HUMBLE + ESP32 RTOS)</text>
    <text x="730" y="55" font-size="9" text-anchor="end" fill="#4ce0ff" letter-spacing="1.5">● TOP-DOWN KINEMATICS</text>
    <text x="730" y="70" font-size="8.5" text-anchor="end" fill="#588bb8">SCALE: 1:2.5 [METRIC]</text>
  </g>

  <!-- ==================== RANGE RINGS (LDS-02 LIDAR 360° PLANAR FIELD) ==================== -->
  <g transform="translate(450, 310)">
    <!-- Concentric Distance Range Rings -->
    <circle r="60" fill="none" stroke="#22486e" stroke-width="1" stroke-dasharray="3 3"/>
    <circle r="120" fill="none" stroke="#24507d" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="190" fill="none" stroke="#20456c" stroke-width="1" stroke-dasharray="5 5"/>
    <circle r="255" fill="none" stroke="#1b3959" stroke-width="0.8" stroke-dasharray="6 6"/>

    <!-- Range Distance Labels -->
    <text x="65" y="-5" font-family="'DM Mono', monospace" font-size="7.5" fill="#4a77a1">0.5m</text>
    <text x="125" y="-5" font-family="'DM Mono', monospace" font-size="7.5" fill="#4a77a1">1.0m</text>
    <text x="195" y="-5" font-family="'DM Mono', monospace" font-size="7.5" fill="#4a77a1">2.0m</text>
    <text x="260" y="-5" font-family="'DM Mono', monospace" font-size="7.5" fill="#3d6387">3.5m MAX</text>

    <!-- 360° Laser Scan Radial Rays -->
    <g stroke="#3da6cf" stroke-width="0.7" opacity="0.35">
      <line x1="-250" y1="0" x2="250" y2="0"/>
      <line x1="0" y1="-250" x2="0" y2="250"/>
      <line x1="-176" y1="-176" x2="176" y2="176"/>
      <line x1="-176" y1="176" x2="176" y2="-176"/>
    </g>

    <!-- Simulated Active Scan Ray Slice -->
    <path d="M 0 0 L 220 -80 A 235 235 0 0 1 230 -20 Z" fill="url(#lidar-cone)"/>
    <line x1="0" y1="0" x2="230" y2="-50" stroke="#7ce8ff" stroke-width="1.8" filter="url(#laser-glow)"/>
    <circle cx="230" cy="-50" r="3.5" fill="#ffffff" filter="url(#laser-glow)"/>
  </g>

  <!-- ==================== ROBOT CHASSIS & MECHANICS ==================== -->
  <g transform="translate(450, 310)">
    <!-- Base Plate Outline (Rounded Octagonal Differential-Drive Hull) -->
    <polygon points="
      -85,-120 85,-120 120,-80 120,80 85,120 -85,120 -120,80 -120,-80
    " fill="url(#chassis-grad)" stroke="#46dbff" stroke-width="2"/>

    <!-- Inner Chassis Structure Ribs -->
    <polygon points="
      -75,-110 75,-110 108,-72 108,72 75,110 -75,110 -108,72 -108,-72
    " fill="none" stroke="#254d78" stroke-width="1.2"/>

    <!-- Front Caster Ball Support (Top in 2D Top-Down View: Heading +X is Up) -->
    <g transform="translate(0, -95)">
      <circle r="14" fill="#0d1f33" stroke="#5bb0df" stroke-width="1.5"/>
      <circle r="7" fill="#69c8fa"/>
      <text x="22" y="3" font-family="'DM Mono', monospace" font-size="7" fill="#75b0db">OMNI CASTER [FWD]</text>
    </g>

    <!-- Rear Caster Ball Support -->
    <g transform="translate(0, 95)">
      <circle r="14" fill="#0d1f33" stroke="#5bb0df" stroke-width="1.5"/>
      <circle r="7" fill="#69c8fa"/>
      <text x="22" y="3" font-family="'DM Mono', monospace" font-size="7" fill="#75b0db">OMNI CASTER [AFT]</text>
    </g>

    <!-- LEFT DRIVE WHEEL (At x: -135, y: 0) -->
    <g transform="translate(-132, 0)">
      <!-- Wheel Tread -->
      <rect x="-16" y="-45" width="32" height="90" rx="6" fill="url(#wheel-grad)" stroke="#52e0ff" stroke-width="1.8"/>
      <!-- Wheel Treads Pattern -->
      <line x1="-12" y1="-30" x2="12" y2="-30" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="15" x2="12" y2="15" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="30" x2="12" y2="30" stroke="#336696" stroke-width="1.5"/>
      <!-- Motor Shaft Coupling -->
      <rect x="16" y="-8" width="12" height="16" fill="#1b3959" stroke="#3c75ab" stroke-width="1"/>
      <!-- Velocity Vector -->
      <line x1="-28" y1="35" x2="-28" y2="-35" stroke="#4ce0ff" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="-40" y="4" font-family="'DM Mono', monospace" font-size="7.5" fill="#7adfff" text-anchor="end">ω_LEFT [50Hz]</text>
    </g>

    <!-- RIGHT DRIVE WHEEL (At x: 135, y: 0) -->
    <g transform="translate(132, 0)">
      <rect x="-16" y="-45" width="32" height="90" rx="6" fill="url(#wheel-grad)" stroke="#52e0ff" stroke-width="1.8"/>
      <line x1="-12" y1="-30" x2="12" y2="-30" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="15" x2="12" y2="15" stroke="#336696" stroke-width="1.5"/>
      <line x1="-12" y1="30" x2="12" y2="30" stroke="#336696" stroke-width="1.5"/>
      <rect x="-28" y="-8" width="12" height="16" fill="#1b3959" stroke="#3c75ab" stroke-width="1"/>
      <text x="40" y="4" font-family="'DM Mono', monospace" font-size="7.5" fill="#7adfff">ω_RIGHT [50Hz]</text>
    </g>

    <!-- INTERNAL ELECTRONIC COMPUTATION BLOCKS -->
    <!-- Raspberry Pi 4B High-Level SBC (x: -50, y: -65) -->
    <g transform="translate(-48, -62)">
      <rect width="96" height="58" rx="3" fill="#0d243d" stroke="#3a8ac9" stroke-width="1.2"/>
      <text x="48" y="24" font-family="'DM Mono', monospace" font-size="8" fill="#88cbff" text-anchor="middle" font-weight="600">RASPBERRY PI 4B</text>
      <text x="48" y="38" font-family="'DM Mono', monospace" font-size="6.5" fill="#5895c2" text-anchor="middle">ROS 2 HUMBLE · UBUNTU 22.04</text>
      <text x="48" y="49" font-family="'DM Mono', monospace" font-size="6.5" fill="#3c6f94" text-anchor="middle">SLAM &amp; NAV2 COMPUTATION</text>
    </g>

    <!-- ESP32 Low-Level RTOS Controller (x: -45, y: 35) -->
    <g transform="translate(-45, 30)">
      <rect width="90" height="45" rx="3" fill="#102b47" stroke="#48a0e0" stroke-width="1.2"/>
      <text x="45" y="18" font-family="'DM Mono', monospace" font-size="8" fill="#9cd7ff" text-anchor="middle" font-weight="600">ESP32-WROOM-32</text>
      <text x="45" y="30" font-family="'DM Mono', monospace" font-size="6.5" fill="#5ea4d6" text-anchor="middle">MOTOR PWM &amp; ENCODER PID</text>
      <text x="45" y="40" font-family="'DM Mono', monospace" font-size="6" fill="#3f7a9e" text-anchor="middle">50Hz ODOMETRY TELEMETRY</text>
    </g>

    <!-- LDS-02 2D LIDAR CENTER TURRET -->
    <g transform="translate(0, 0)">
      <!-- Outer Scanner Housing -->
      <circle r="34" fill="#091829" stroke="#52e0ff" stroke-width="2"/>
      <circle r="26" fill="#14304d" stroke="#3881b8" stroke-width="1.2"/>
      <!-- Rotating Optical Head Aperture -->
      <circle r="14" fill="#204c75" stroke="#72f1ff" stroke-width="1.5" filter="url(#laser-glow)"/>
      <circle r="6" fill="#ffffff" filter="url(#laser-glow)"/>
      <text x="42" y="-12" font-family="'DM Mono', monospace" font-size="7.5" fill="#69dbff">LDS-02 2D LIDAR</text>
      <text x="42" y="-2" font-family="'DM Mono', monospace" font-size="6.5" fill="#4a8cb8">360° PLANAR LASER SCAN</text>
    </g>

    <!-- DWM3001C UWB TAG ANTENNA (At Left Flank x: -80, y: -30) -->
    <g transform="translate(-82, -32)">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#1d4a73" stroke="#5ce6ff" stroke-width="1.2"/>
      <!-- UWB RF Wavefronts -->
      <path d="M -13 -13 A 18 18 0 0 0 -13 13" fill="none" stroke="#5ce6ff" stroke-width="1" stroke-dasharray="2 2"/>
      <path d="M -19 -19 A 26 26 0 0 0 -19 19" fill="none" stroke="#5ce6ff" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="-25" y="-14" font-family="'DM Mono', monospace" font-size="7" fill="#69dcff" text-anchor="end">DWM3001C UWB TAG</text>
      <text x="-25" y="-4" font-family="'DM Mono', monospace" font-size="6" fill="#4589b8" text-anchor="end">ANCHOR TWR RANGING</text>
    </g>

    <!-- ROBOT COORDINATE FRAME ORIGIN (base_link) -->
    <g transform="translate(0, 0)">
      <!-- +X Axis Vector (Forward - Upwards in 2D Top View) -->
      <line x1="0" y1="0" x2="0" y2="-65" stroke="#ff5555" stroke-width="2"/>
      <polygon points="0,-72 -4,-62 4,-62" fill="#ff5555"/>
      <text x="8" y="-62" font-family="'DM Mono', monospace" font-size="7.5" fill="#ff7777">+X (FWD)</text>

      <!-- +Y Axis Vector (Leftwards) -->
      <line x1="0" y1="0" x2="-65" y2="0" stroke="#44dd66" stroke-width="2"/>
      <polygon points="-72,0 -62,-4 -62,4" fill="#44dd66"/>
      <text x="-65" y="-8" font-family="'DM Mono', monospace" font-size="7.5" fill="#66ff88" text-anchor="end">+Y (LEFT)</text>

      <!-- Center Pivot Marker -->
      <circle r="3" fill="#ffffff"/>
      <text x="8" y="14" font-family="'DM Mono', monospace" font-size="7.5" fill="#ffffff">base_link</text>
    </g>

    <!-- PHYSICAL DIMENSION ANNOTATIONS -->
    <!-- Wheelbase Track Width: 264mm -->
    <g stroke="#396c99" stroke-width="0.8">
      <line x1="-132" y1="65" x2="-132" y2="145"/>
      <line x1="132" y1="65" x2="132" y2="145"/>
      <line x1="-132" y1="140" x2="132" y2="140"/>
      <text x="0" y="152" font-family="'DM Mono', monospace" font-size="7.5" fill="#6ab3e8" text-anchor="middle" stroke="none">TRACK WIDTH: 264mm</text>
    </g>
  </g>

  <!-- ==================== BLUEPRINT FOOTER SPECS & GITHUB BADGE ==================== -->
  <g transform="translate(45, 520)" font-family="'DM Mono', monospace">
    <rect width="810" height="42" rx="2" fill="#081524" stroke="#254d78" stroke-width="1"/>
    <text x="18" y="18" font-size="7.5" fill="#88c2f0">DRIVE KINEMATICS: DIFFERENTIAL (2WD + DUAL CASTER)</text>
    <text x="18" y="32" font-size="7.5" fill="#5588b3">LOCALIZATION: EKF FUSION (ODOMETRY + UWB ANCHORS)</text>

    <text x="420" y="18" font-size="7.5" fill="#88c2f0">LIDAR FOV: 360° PLANAR @ 5.5Hz</text>
    <text x="420" y="32" font-size="7.5" fill="#5588b3">SLAM PIPELINE: SLAM TOOLBOX + NAV2</text>

    <text x="792" y="25" font-size="8" fill="#46dbff" text-anchor="end" font-weight="600">GITHUB: Diopurp/Columbus-Maximus ↗</text>
  </g>
</svg>
