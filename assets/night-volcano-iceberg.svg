<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%">
  <defs>
    <!-- Sky & Volcanic Atmosphere Gradients -->
    <linearGradient id="stratosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="25%" stop-color="#0f050d"/>
      <stop offset="50%" stop-color="#280713"/>
      <stop offset="75%" stop-color="#560e19"/>
      <stop offset="92%" stop-color="#8c1b1c"/>
      <stop offset="100%" stop-color="#b82a1e"/>
    </linearGradient>

    <!-- Deep Ocean Water Column (Realistic Light Attenuation with Depth) -->
    <linearGradient id="ocean-column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122a54"/>
      <stop offset="12%" stop-color="#0b1e42"/>
      <stop offset="35%" stop-color="#071533"/>
      <stop offset="65%" stop-color="#040d24"/>
      <stop offset="85%" stop-color="#020716"/>
      <stop offset="100%" stop-color="#01030d"/>
    </linearGradient>

    <!-- Incandescent Magma Core -->
    <linearGradient id="magma-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff8b0"/>
      <stop offset="45%" stop-color="#ff7a18"/>
      <stop offset="80%" stop-color="#d61e12"/>
      <stop offset="100%" stop-color="#6e0b0e"/>
    </linearGradient>

    <!-- Volcanic Plume Volumetric Glow -->
    <radialGradient id="plume-illumination" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#ff7b2b" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#c92a18" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#4d0e1b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14050d" stop-opacity="0"/>
    </radialGradient>

    <!-- Iceberg Crystalline Shading (Subsurface Scattering) -->
    <linearGradient id="ice-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ffff"/>
      <stop offset="22%" stop-color="#6ee2ff"/>
      <stop offset="50%" stop-color="#1f7db8"/>
      <stop offset="78%" stop-color="#0d3c75"/>
      <stop offset="100%" stop-color="#05193d"/>
    </linearGradient>

    <linearGradient id="ice-spire-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3cc7ed"/>
      <stop offset="45%" stop-color="#166299"/>
      <stop offset="78%" stop-color="#09315c"/>
      <stop offset="100%" stop-color="#03152d"/>
    </linearGradient>

    <!-- Filters for Atmospheric Scatter, Lava Glow, and Marine Bioluminescence -->
    <filter id="volcano-heat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="lava-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="crepuscular-haze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="bio-particle-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ABOVE OCEAN SURFACE: THE ERUPTING STRATOVOLCANO (y: 0 - 760) -->
  <!-- ============================================================ -->

  <!-- Atmospheric Night Sky -->
  <rect x="0" y="0" width="1600" height="760" fill="url(#stratosphere)"/>

  <!-- Distant Stars in Clear Upper Atmosphere -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="110" cy="70" r="1.2"/><circle cx="260" cy="45" r="1.5"/><circle cx="410" cy="95" r="1"/>
    <circle cx="580" cy="50" r="1.5"/><circle cx="1020" cy="65" r="1.5"/><circle cx="1180" cy="40" r="1"/>
    <circle cx="1340" cy="85" r="1.5"/><circle cx="1490" cy="50" r="1.2"/><circle cx="1550" cy="110" r="1.5"/>
    <circle cx="190" cy="140" r="1"/><circle cx="1420" cy="150" r="1.2"/>
  </g>

  <!-- Ambient Volcanic Sky Glow (Volumetric Heat Scattering) -->
  <ellipse cx="800" cy="380" rx="520" ry="260" fill="#ff381c" opacity="0.28" filter="url(#lava-glow)"/>
  <ellipse cx="800" cy="320" rx="260" ry="130" fill="#ff8c1a" opacity="0.32" filter="url(#lava-glow)"/>

  <!-- Billowing Ash & Gas Eruption Plume (Mushrooming into Night) -->
  <g opacity="0.75">
    <!-- Backlit Plume Silhouettes -->
    <circle cx="800" cy="200" r="105" fill="#1c0a15" filter="url(#crepuscular-haze)"/>
    <circle cx="730" cy="140" r="125" fill="#180712" filter="url(#crepuscular-haze)"/>
    <circle cx="870" cy="110" r="145" fill="#1a0814" filter="url(#crepuscular-haze)"/>
    <circle cx="790" cy="50" r="170" fill="#14060f" filter="url(#crepuscular-haze)"/>
    <!-- Inner Rim-Lit Glow from Magma Below -->
    <ellipse cx="800" cy="220" rx="140" ry="80" fill="url(#plume-illumination)"/>
  </g>

  <!-- Distant Volcanic Ridges (Silhouetted against Magma Glow) -->
  <path d="M0 640 C160 560 320 620 480 500 C640 380 740 540 890 460 C1060 550 1240 470 1420 580 C1510 520 1560 550 1600 530 V760 H0 Z" fill="#120713"/>
  <path d="M0 680 C180 590 380 650 580 530 C740 560 920 490 1100 600 C1280 520 1440 610 1600 580 V760 H0 Z" fill="#180a18"/>

  <!-- ==================== MAIN VOLCANIC CONE ==================== -->
  <!-- Basalt Strata Flanks (Steep Krakatoan Slopes, Summit at x: 800, y: 310) -->
  <path d="M360 760 L540 630 L660 480 L745 350 L770 320 L830 320 L855 350 L940 480 L1060 630 L1240 760 Z" fill="#1d0e19" stroke="#3d141b" stroke-width="4"/>

  <!-- Volcanic Caldera Crater Opening & Magma Lake -->
  <ellipse cx="800" cy="324" rx="60" ry="18" fill="#590d16"/>
  <ellipse cx="800" cy="324" rx="50" ry="14" fill="url(#magma-core)"/>
  <ellipse cx="800" cy="324" rx="34" ry="8" fill="#ffffff" opacity="0.95" filter="url(#lava-glow)"/>

  <!-- Violent Lava Fountains & Magma Bombs Bursting from Caldera -->
  <g fill="none" stroke-linecap="round">
    <path d="M780 320 C765 240 785 190 798 160" stroke="#fff194" stroke-width="5" opacity="0.95"/>
    <path d="M800 320 C815 230 825 180 820 150" stroke="#ff8424" stroke-width="6" opacity="0.95"/>
    <path d="M790 322 C755 250 760 210 775 175" stroke="#ff451a" stroke-width="5.5" opacity="0.9"/>
    <path d="M812 322 C835 260 850 220 842 185" stroke="#ffaa32" stroke-width="4.5" opacity="0.9"/>
  </g>

  <!-- Braided Magma Rivers (Cascading down Basalt Ravines with Cooling Crusts) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Center-Left Lava River -->
    <path d="M795 330 C785 410 755 490 715 620 C690 700 670 735 660 760" stroke="#991410" stroke-width="18"/>
    <path d="M795 330 C785 410 755 490 715 620 C690 700 670 735 660 760" stroke="url(#magma-core)" stroke-width="12"/>
    <path d="M795 330 C785 410 755 490 715 620 C690 700 670 735 660 760" stroke="#fff5b8" stroke-width="4" opacity="0.9"/>

    <!-- Left Tributary Branch -->
    <path d="M760 480 C705 530 645 615 570 760" stroke="#8a100e" stroke-width="13"/>
    <path d="M760 480 C705 530 645 615 570 760" stroke="url(#magma-core)" stroke-width="8"/>
    <path d="M760 480 C705 530 645 615 570 760" stroke="#ffeb80" stroke-width="2.5" opacity="0.9"/>

    <!-- Main Right Lava River -->
    <path d="M805 335 C830 420 865 510 920 635 C950 700 975 735 985 760" stroke="#991410" stroke-width="16"/>
    <path d="M805 335 C830 420 865 510 920 635 C950 700 975 735 985 760" stroke="url(#magma-core)" stroke-width="10"/>
    <path d="M805 335 C830 420 865 510 920 635 C950 700 975 735 985 760" stroke="#fff5b8" stroke-width="3.5" opacity="0.9"/>

    <!-- Right Tributary Branch -->
    <path d="M860 500 C910 570 990 660 1070 760" stroke="#8a100e" stroke-width="11"/>
    <path d="M860 500 C910 570 990 660 1070 760" stroke="url(#magma-core)" stroke-width="6"/>
  </g>

  <!-- Glowing Volcanic Embers & Tephra Sparks in Flight -->
  <g fill="#ffc85a" opacity="0.88">
    <circle cx="745" cy="260" r="3"/><circle cx="835" cy="240" r="3.5"/><circle cx="790" cy="170" r="2.8"/>
    <circle cx="865" cy="180" r="3.2"/><circle cx="720" cy="210" r="2.5"/><circle cx="825" cy="130" r="2.5"/>
    <circle cx="895" cy="230" r="2.8"/><circle cx="705" cy="290" r="2.5"/><circle cx="885" cy="300" r="3"/>
  </g>

  <!-- Realistic Basalt Mountain Ridges & Shading -->
  <g fill="none" stroke="#2b1118" stroke-width="3" opacity="0.7">
    <path d="M745 350 L660 480 L540 630"/>
    <path d="M855 350 L940 480 L1060 630"/>
    <path d="M790 350 L775 440 L810 550"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. OCEAN SURFACE: WATERLINE & TRANSITION (y: 740 - 820) -->
  <!-- ============================================================ -->

  <!-- Deep Ocean Column (Spans whole lower section y: 750 - 2400) -->
  <rect x="0" y="750" width="1600" height="1650" fill="url(#ocean-column)"/>

  <!-- Molten Lava Reflection Across Surface Swells -->
  <ellipse cx="800" cy="752" rx="460" ry="24" fill="#ff451d" opacity="0.55" filter="url(#lava-glow)"/>
  <ellipse cx="800" cy="754" rx="220" ry="12" fill="#ffa034" opacity="0.75" filter="url(#lava-glow)"/>

  <!-- Subsurface Glacial Turquoise Glow Meeting the Lava Heat -->
  <ellipse cx="800" cy="770" rx="580" ry="34" fill="#28c4f0" opacity="0.45" filter="url(#lava-glow)"/>

  <!-- Realistic Ocean Waterline Waves & Sea Foam -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 748 C200 742 400 749 600 746 C800 748 1000 745 1200 749 C1400 744 1500 748 1600 746" stroke="#ff6a3d" stroke-width="6" opacity="0.9"/>
    <path d="M0 754 C220 758 440 752 660 756 C880 753 1100 756 1320 752 C1460 756 1540 754 1600 756" stroke="#5de4ff" stroke-width="5" opacity="0.95"/>
    <path d="M0 762 C260 766 520 760 780 764 C1040 761 1300 765 1600 762" stroke="#1d94be" stroke-width="3" opacity="0.65"/>
  </g>

  <!-- Atmospheric Sea-Smoke / Steam Fog Over Waterline -->
  <path d="M0 735 C380 715 780 736 1180 725 C1380 715 1500 735 1600 730 V775 C1220 755 820 772 420 762 C200 745 90 770 0 765 Z" fill="#4d1b28" opacity="0.38" filter="url(#lava-glow)"/>
  <path d="M0 755 C400 740 820 760 1240 748 C1440 738 1520 755 1600 752 V785 C1200 770 800 784 400 775 C180 765 80 780 0 778 Z" fill="#144b6e" opacity="0.35" filter="url(#lava-glow)"/>

  <!-- ============================================================ -->
  <!-- 3. SUBMERGED ICEBERG MASS: ENORMOUS UPPER CORE (y: 760 - 1450) -->
  <!-- (Considerably larger than the mountain above!) -->
  <!-- ============================================================ -->

  <!-- Deep Underwater Crepuscular Light Beams (Filtering Down from Surface) -->
  <g fill="none" stroke="#4ae5ff" opacity="0.09" stroke-linecap="round" filter="url(#crepuscular-haze)">
    <path d="M300 760 L140 1480" stroke-width="90"/>
    <path d="M560 760 L420 1580" stroke-width="120"/>
    <path d="M1060 760 L1160 1580" stroke-width="130"/>
    <path d="M1300 760 L1440 1480" stroke-width="100"/>
  </g>

  <!-- Master Submerged Iceberg Body (Colossal Width: x: 160 - 1440) -->
  <g>
    <!-- Outer Ice Silhouette & Mass -->
    <polygon points="
      320,760 170,870 230,1020 150,1180 270,1320 440,1450
      1160,1450 1330,1320 1450,1180 1370,1020 1430,870 1280,760
    " fill="url(#ice-body)" stroke="#8aeaff" stroke-width="4.5"/>

    <!-- Central Glowing Core of Compressed Ancient Glacial Ice -->
    <polygon points="360,780 260,950 330,1220 520,1400 1080,1400 1270,1220 1340,950 1240,780" fill="#0b386e" opacity="0.85"/>

    <!-- Realistic Facets, Sheared Planes & Cleavage Strata -->
    <!-- Left Flank Facets -->
    <polygon points="170,870 320,760 380,910 260,950" fill="#75e4ff" opacity="0.55"/>
    <polygon points="260,950 380,910 420,1090 230,1020" fill="#2987be" opacity="0.65"/>
    <polygon points="230,1020 420,1090 390,1260 150,1180" fill="#135282" opacity="0.75"/>
    <polygon points="150,1180 390,1260 520,1400 270,1320" fill="#0c3660" opacity="0.85"/>

    <!-- Right Flank Facets -->
    <polygon points="1430,870 1280,760 1220,910 1340,950" fill="#9bf1ff" opacity="0.48"/>
    <polygon points="1340,950 1220,910 1180,1090 1370,1020" fill="#359bd5" opacity="0.65"/>
    <polygon points="1370,1020 1180,1090 1210,1260 1450,1180" fill="#175d94" opacity="0.75"/>
    <polygon points="1450,1180 1210,1260 1080,1400 1330,1320" fill="#0d3b6a" opacity="0.85"/>

    <!-- Central Geometric Facets Catching Translucent Light -->
    <polygon points="380,910 650,830 780,960 560,1060 420,1090" fill="#46c6ee" opacity="0.7"/>
    <polygon points="650,830 950,830 820,960 780,960" fill="#ebffff" opacity="0.88"/>
    <polygon points="950,830 1220,910 1180,1090 1040,1060 820,960" fill="#58d0f4" opacity="0.7"/>
    <polygon points="780,960 820,960 860,1180 740,1180" fill="#2076ab" opacity="0.8"/>
    <polygon points="560,1060 740,1180 660,1360 480,1330" fill="#124f80" opacity="0.85"/>
    <polygon points="1040,1060 860,1180 940,1360 1120,1330" fill="#145487" opacity="0.85"/>

    <!-- Razor-Sharp Crystalline Crevasse Edges & Fractures -->
    <g fill="none" stroke="#d5f8ff" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M650 830 L780 960 L740 1180 L660 1360" stroke-width="5"/>
      <path d="M950 830 L820 960 L860 1180 L940 1360" stroke-width="5"/>
      <path d="M380 910 L560 1060 L480 1330" stroke-width="3.5"/>
      <path d="M1220 910 L1040 1060 L1120 1330" stroke-width="3.5"/>
      <path d="M780 960 L820 960" stroke-width="5.5"/>
    </g>

    <!-- Deep Shadow Crevasses Inside Submerged Ice -->
    <g fill="none" stroke="#030f26" stroke-width="4" opacity="0.9">
      <path d="M420 1090 L560 1060 L740 1180 L800 1380"/>
      <path d="M1180 1090 L1040 1060 L860 1180 L800 1380"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 4. DEEP ABYSS & TAPERING GLACIAL KEEL (y: 1450 - 2400) -->
  <!-- (The glacier tapers progressively thinner into a razor spire) -->
  <!-- ============================================================ -->

  <!-- Upper Spire Transition (y: 1450 - 1750, narrows from 720px to 280px) -->
  <polygon points="
    440,1450 560,1600 660,1750
    940,1750 1040,1600 1160,1450
  " fill="url(#ice-spire-grad)" stroke="#5ae0ff" stroke-width="3.5"/>

  <!-- Mid Spire Section (y: 1750 - 2050, narrows from 280px to 120px) -->
  <polygon points="
    660,1750 710,1900 740,2050
    860,2050 890,1900 940,1750
  " fill="url(#ice-spire-grad)" stroke="#3bc4eb" stroke-width="3"/>

  <!-- Deep Keel Needle Spire (y: 2050 - 2370, narrows to sharp needle tip at y: 2375) -->
  <polygon points="
    740,2050 765,2200 788,2320 800,2375
    812,2320 835,2200 860,2050
  " fill="url(#ice-spire-grad)" stroke="#20a5cd" stroke-width="2.5"/>

  <!-- Crystalline Facets on Tapering Spire Spine -->
  <g opacity="0.65">
    <polygon points="660,1750 800,1750 775,1900 710,1900" fill="#248bc0"/>
    <polygon points="800,1750 940,1750 890,1900 825,1900" fill="#155d8d"/>
    <polygon points="710,1900 800,1900 780,2050 740,2050" fill="#1a72a2"/>
    <polygon points="800,1900 890,1900 860,2050 820,2050" fill="#0f4870"/>
    <polygon points="740,2050 800,2050 790,2200 765,2200" fill="#125c88"/>
    <polygon points="800,2050 860,2050 835,2200 810,2200" fill="#093556"/>
    <!-- Central Ridge Spine Line of the Glacial Keel -->
    <path d="M800 1450 L800 1750 L800 1900 L800 2050 L800 2200 L800 2375" stroke="#80e8ff" stroke-width="2.5" fill="none" opacity="0.75"/>
  </g>

  <!-- Deep Underwater Crepuscular Light Beams Fading in Abyss -->
  <g fill="none" stroke="#22bfeb" opacity="0.04" stroke-linecap="round">
    <path d="M720 1450 L630 2360" stroke-width="45"/>
    <path d="M880 1450 L970 2360" stroke-width="45"/>
  </g>

  <!-- ============================================================ -->
  <!-- 5. REALISTIC BIOLUMINESCENT ORGANISMS IN DARK WATER -->
  <!-- ============================================================ -->
  <g filter="url(#bio-particle-glow)">
    <!-- Cyan & Electric Blue Bioluminescence around Upper/Mid Glacier Shelf -->
    <circle cx="270" cy="980" r="4.5" fill="#54e9ff" opacity="0.9"/>
    <circle cx="200" cy="1120" r="3.5" fill="#8bf4ff" opacity="0.8"/>
    <circle cx="330" cy="1280" r="5" fill="#44dbff" opacity="0.95"/>
    <circle cx="1390" cy="990" r="4.2" fill="#6feaff" opacity="0.9"/>
    <circle cx="1470" cy="1140" r="3.6" fill="#92f5ff" opacity="0.85"/>
    <circle cx="1300" cy="1290" r="5.2" fill="#40d6ff" opacity="0.95"/>

    <!-- Bioluminescent Micro-Organisms around Tapering Glacier into Deep Trench -->
    <!-- Left Abyssal Trench -->
    <circle cx="470" cy="1580" r="4.5" fill="#4ee0ff" opacity="0.85"/>
    <circle cx="380" cy="1720" r="3.6" fill="#78edff" opacity="0.78"/>
    <circle cx="510" cy="1860" r="4.2" fill="#38d2f5" opacity="0.9"/>
    <circle cx="420" cy="2020" r="3.6" fill="#6fe7ff" opacity="0.8"/>
    <circle cx="570" cy="2140" r="4.5" fill="#3ad4f7" opacity="0.85"/>
    <circle cx="660" cy="2260" r="3.2" fill="#8af1ff" opacity="0.95"/>
    <circle cx="530" cy="2320" r="3.6" fill="#43d6f8" opacity="0.75"/>

    <!-- Right Abyssal Trench -->
    <circle cx="1130" cy="1580" r="4.2" fill="#52e3ff" opacity="0.9"/>
    <circle cx="1220" cy="1730" r="3.6" fill="#80efff" opacity="0.75"/>
    <circle cx="1090" cy="1880" r="4.5" fill="#3ad4f7" opacity="0.9"/>
    <circle cx="1180" cy="2040" r="3.2" fill="#6be6ff" opacity="0.8"/>
    <circle cx="1030" cy="2150" r="4.2" fill="#36d1f4" opacity="0.85"/>
    <circle cx="940" cy="2270" r="3.6" fill="#82f2ff" opacity="0.95"/>
    <circle cx="1070" cy="2330" r="3.2" fill="#41d5f7" opacity="0.75"/>

    <!-- Proximal Deep-Sea Organisms along Tapered Spire Tip -->
    <circle cx="705" cy="1820" r="3.2" fill="#9ef6ff" opacity="0.9"/>
    <circle cx="895" cy="1840" r="3.2" fill="#9ef6ff" opacity="0.9"/>
    <circle cx="725" cy="1980" r="2.8" fill="#b8f9ff" opacity="0.95"/>
    <circle cx="875" cy="2000" r="2.8" fill="#b8f9ff" opacity="0.95"/>
    <circle cx="750" cy="2150" r="3.2" fill="#9cf5ff" opacity="0.95"/>
    <circle cx="850" cy="2170" r="3.2" fill="#9cf5ff" opacity="0.95"/>
    <circle cx="775" cy="2280" r="2.6" fill="#d2fbff" opacity="0.95"/>
    <circle cx="825" cy="2300" r="2.6" fill="#d2fbff" opacity="0.95"/>
    <circle cx="800" cy="2388" r="3.8" fill="#8af1ff" opacity="0.98"/>
  </g>
</svg>
