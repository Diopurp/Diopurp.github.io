<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%">
  <defs>
    <!-- Sky & Volcanic Atmosphere -->
    <linearGradient id="volcanic-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="30%" stop-color="#14060f"/>
      <stop offset="60%" stop-color="#380915"/>
      <stop offset="85%" stop-color="#69141d"/>
      <stop offset="100%" stop-color="#9a241b"/>
    </linearGradient>

    <!-- Deep Ocean Gradient (Darkens progressively as we go deeper) -->
    <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11254a"/>
      <stop offset="15%" stop-color="#0a1a3b"/>
      <stop offset="40%" stop-color="#06122d"/>
      <stop offset="70%" stop-color="#030b1e"/>
      <stop offset="100%" stop-color="#01040f"/>
    </linearGradient>

    <!-- Lava Streams -->
    <linearGradient id="lava-flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffe66d"/>
      <stop offset="55%" stop-color="#ff5f1f"/>
      <stop offset="100%" stop-color="#b81d13"/>
    </linearGradient>

    <!-- Glowing Caldera Core -->
    <radialGradient id="caldera-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5a0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ff6224" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#c91818" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#540812" stop-opacity="0"/>
    </radialGradient>

    <!-- Iceberg Crystalline Shading -->
    <linearGradient id="ice-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebffff"/>
      <stop offset="30%" stop-color="#5cd2f7"/>
      <stop offset="65%" stop-color="#1a6ea9"/>
      <stop offset="100%" stop-color="#0a2a5e"/>
    </linearGradient>

    <linearGradient id="ice-facet-bright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#73e5ff" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="ice-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071b3e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020917" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Tapered Lower Iceberg Spire Gradient -->
    <linearGradient id="ice-spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bfe3"/>
      <stop offset="50%" stop-color="#145b8c"/>
      <stop offset="85%" stop-color="#0a2e52"/>
      <stop offset="100%" stop-color="#041429"/>
    </linearGradient>

    <!-- Bioluminescent Glow Filter -->
    <filter id="bio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="lava-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. ABOVE OCEAN SURFACE: THE ERUPTING VOLCANO (y: 0 to 760) -->
  <!-- ========================================== -->

  <!-- Sky Base -->
  <rect x="0" y="0" width="1600" height="760" fill="url(#volcanic-sky)"/>

  <!-- Distant Night Stars in upper atmosphere -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/><circle cx="280" cy="45" r="1"/><circle cx="450" cy="110" r="1.5"/>
    <circle cx="620" cy="60" r="1"/><circle cx="980" cy="75" r="1.5"/><circle cx="1140" cy="40" r="1"/>
    <circle cx="1320" cy="95" r="1.5"/><circle cx="1490" cy="55" r="1"/><circle cx="1550" cy="120" r="1.5"/>
    <circle cx="220" cy="160" r="1"/><circle cx="1380" cy="170" r="1.2"/>
  </g>

  <!-- Atmospheric Eruption Haze Glow -->
  <ellipse cx="800" cy="380" rx="480" ry="240" fill="#ff381e" opacity="0.25" filter="url(#lava-blur)"/>
  <ellipse cx="800" cy="330" rx="220" ry="110" fill="#ff9922" opacity="0.3" filter="url(#lava-blur)"/>

  <!-- Volcanic Smoke Plume rising into night -->
  <g fill="#24111d" opacity="0.55" filter="url(#lava-blur)">
    <circle cx="790" cy="210" r="95"/>
    <circle cx="730" cy="150" r="120"/>
    <circle cx="850" cy="120" r="140"/>
    <circle cx="780" cy="60" r="160"/>
  </g>

  <!-- Distant Volcanic Ridges (Silhouetted against fiery glow) -->
  <path d="M0 640 L180 570 L360 610 L540 490 L710 560 L890 470 L1080 570 L1260 480 L1440 590 L1600 520 V760 H0 Z" fill="#150a16"/>
  <path d="M0 680 L220 590 L420 640 L640 520 L800 570 L960 510 L1180 620 L1390 540 L1600 630 V760 H0 Z" fill="#1b0e1d"/>

  <!-- MAIN ERUPTING VOLCANO (Center: x: 420 to 1180, Summit at x: 800, y: 310) -->
  <path d="M380 750 L560 620 L680 470 L755 350 L775 320 L825 320 L845 350 L920 470 L1040 620 L1220 750 Z" fill="#20111a" stroke="#4a181d" stroke-width="4"/>

  <!-- Volcanic Crater Caldera Opening & Magma Core -->
  <ellipse cx="800" cy="325" rx="55" ry="16" fill="url(#caldera-glow)"/>
  <ellipse cx="800" cy="325" rx="42" ry="11" fill="#fff5a0" opacity="0.95"/>

  <!-- Glowing Lava Fountains bursting from Caldera -->
  <path d="M780 320 Q770 250 790 220 Q805 270 802 320" fill="url(#lava-flow)" opacity="0.9"/>
  <path d="M800 320 Q815 240 825 210 Q820 270 812 320" fill="url(#lava-flow)" opacity="0.9"/>
  <path d="M790 322 Q750 260 760 230 Q780 275 795 322" fill="url(#lava-flow)" opacity="0.85"/>

  <!-- Cascading Magma Streams (Carving down mountain flanks) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main central river -->
    <path d="M795 330 Q785 410 760 490 T720 630 T680 750" stroke="url(#lava-flow)" stroke-width="14" opacity="0.95"/>
    <path d="M795 330 Q785 410 760 490 T720 630 T680 750" stroke="#fff8c0" stroke-width="5" opacity="0.9"/>
    <!-- Branch left -->
    <path d="M765 470 Q710 520 650 610 T580 750" stroke="url(#lava-flow)" stroke-width="9" opacity="0.9"/>
    <path d="M765 470 Q710 520 650 610 T580 750" stroke="#ffeb80" stroke-width="3" opacity="0.85"/>
    <!-- Branch right -->
    <path d="M810 335 Q830 420 860 500 T910 640 T960 750" stroke="url(#lava-flow)" stroke-width="11" opacity="0.95"/>
    <path d="M810 335 Q830 420 860 500 T910 640 T960 750" stroke="#fff8c0" stroke-width="4" opacity="0.9"/>
    <!-- Minor tributary right -->
    <path d="M855 490 Q900 560 980 650 T1060 750" stroke="url(#lava-flow)" stroke-width="7" opacity="0.85"/>
  </g>

  <!-- Volcanic Ember Sparks in Sky -->
  <g fill="#ffc252" opacity="0.85">
    <circle cx="750" cy="270" r="3.5"/><circle cx="830" cy="250" r="4"/><circle cx="790" cy="180" r="3"/>
    <circle cx="860" cy="190" r="3"/><circle cx="720" cy="220" r="2.5"/><circle cx="820" cy="140" r="2.5"/>
    <circle cx="890" cy="240" r="3"/><circle cx="710" cy="300" r="2.5"/><circle cx="880" cy="310" r="3"/>
  </g>

  <!-- Basalt Mountain Texture & Ridges -->
  <g fill="none" stroke="#3b1622" stroke-width="2.5" opacity="0.6">
    <path d="M755 350 L680 470 L560 620"/>
    <path d="M845 350 L920 470 L1040 620"/>
    <path d="M790 350 L780 440 L820 540"/>
  </g>


  <!-- ========================================== -->
  <!-- 2. AT THE OCEAN SURFACE: WATERLINE & TRANSITION (y: 740 to 820) -->
  <!-- ========================================== -->

  <!-- Deep Ocean Base (Spanning whole lower section y: 750 to 2400) -->
  <rect x="0" y="750" width="1600" height="1650" fill="url(#ocean-depth)"/>

  <!-- Molten Reflection on Water Surface -->
  <ellipse cx="800" cy="752" rx="420" ry="22" fill="#ff4c24" opacity="0.5" filter="url(#lava-blur)"/>
  <ellipse cx="800" cy="754" rx="200" ry="10" fill="#ff9933" opacity="0.7" filter="url(#lava-blur)"/>

  <!-- Subsurface Glacial Cyan Glow Meeting the Fire -->
  <ellipse cx="800" cy="768" rx="550" ry="32" fill="#30b5e8" opacity="0.4" filter="url(#lava-blur)"/>

  <!-- HORIZONTAL WATERLINE STRATA -->
  <g fill="none" stroke-linecap="round">
    <!-- Warm upper waterline wave -->
    <path d="M0 748 Q200 742 400 748 T800 747 T1200 748 T1600 746" stroke="#ff6b3d" stroke-width="5" opacity="0.85"/>
    <!-- Glacial cold transition waterline wave -->
    <path d="M0 754 Q200 758 400 753 T800 755 T1200 753 T1600 756" stroke="#5de0ff" stroke-width="4.5" opacity="0.95"/>
    <path d="M0 762 Q250 766 500 761 T1000 763 T1600 760" stroke="#1d8eb8" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Atmospheric Sea Fog / Mist over Waterline -->
  <path d="M0 735 Q400 715 800 735 T1600 730 V775 Q1200 755 800 770 T0 765 Z" fill="#4d1f2b" opacity="0.35" filter="url(#lava-blur)"/>
  <path d="M0 755 Q400 740 800 758 T1600 752 V785 Q1200 770 800 782 T0 778 Z" fill="#154563" opacity="0.3" filter="url(#lava-blur)"/>


  <!-- ========================================== -->
  <!-- 3. BELOW THE OCEAN SURFACE: ENORMOUS UPPER ICEBERG (y: 760 to 1450) -->
  <!-- (Notice: Considerably larger than the volcano above!) -->
  <!-- ========================================== -->

  <!-- Deep Underwater Ambient Crepuscular Light Rays (Filtering down from surface) -->
  <g fill="none" stroke="#4ae5ff" opacity="0.08" stroke-linecap="round">
    <path d="M320 760 L180 1450" stroke-width="80"/>
    <path d="M580 760 L460 1550" stroke-width="110"/>
    <path d="M1040 760 L1120 1550" stroke-width="120"/>
    <path d="M1280 760 L1400 1450" stroke-width="90"/>
  </g>

  <!-- COLOSSAL SUBMERGED ICEBERG BODY (Spans wide: x: 180 to 1420) -->
  <g>
    <!-- Master Ice Silhouette -->
    <polygon points="
      320,760 180,870 240,1020 160,1180 280,1320 440,1450
      1160,1450 1320,1320 1440,1180 1360,1020 1420,870 1280,760
    " fill="url(#ice-main)" stroke="#89ecff" stroke-width="4"/>

    <!-- Central Glowing Core of Deep Ice -->
    <polygon points="360,780 270,950 340,1220 520,1400 1080,1400 1260,1220 1330,950 1240,780" fill="#0c3c72" opacity="0.8"/>

    <!-- Angular Facets & Crystalline Cleavage Planes -->
    <!-- Left Flank Facets -->
    <polygon points="180,870 320,760 380,910 270,950" fill="#75e4ff" opacity="0.5"/>
    <polygon points="270,950 380,910 420,1090 240,1020" fill="#2987be" opacity="0.6"/>
    <polygon points="240,1020 420,1090 390,1260 160,1180" fill="#135282" opacity="0.7"/>
    <polygon points="160,1180 390,1260 520,1400 280,1320" fill="#0c3660" opacity="0.8"/>

    <!-- Right Flank Facets -->
    <polygon points="1420,870 1280,760 1220,910 1330,950" fill="#9bf1ff" opacity="0.45"/>
    <polygon points="1330,950 1220,910 1180,1090 1360,1020" fill="#359bd5" opacity="0.6"/>
    <polygon points="1360,1020 1180,1090 1210,1260 1440,1180" fill="#175d94" opacity="0.7"/>
    <polygon points="1440,1180 1210,1260 1080,1400 1320,1320" fill="#0d3b6a" opacity="0.8"/>

    <!-- Center Facets & Illuminated Crags -->
    <polygon points="380,910 650,830 780,960 560,1060 420,1090" fill="#46c6ee" opacity="0.65"/>
    <polygon points="650,830 950,830 820,960 780,960" fill="#e8ffff" opacity="0.85"/>
    <polygon points="950,830 1220,910 1180,1090 1040,1060 820,960" fill="#58d0f4" opacity="0.65"/>
    <polygon points="780,960 820,960 860,1180 740,1180" fill="#2076ab" opacity="0.75"/>
    <polygon points="560,1060 740,1180 660,1360 480,1330" fill="#124f80" opacity="0.8"/>
    <polygon points="1040,1060 860,1180 940,1360 1120,1330" fill="#145487" opacity="0.8"/>

    <!-- Illuminated Crystalline Crevasse Edges -->
    <g fill="none" stroke="#cbf7ff" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
      <path d="M650 830 L780 960 L740 1180 L660 1360" stroke-width="4.5"/>
      <path d="M950 830 L820 960 L860 1180 L940 1360" stroke-width="4.5"/>
      <path d="M380 910 L560 1060 L480 1330" stroke-width="3"/>
      <path d="M1220 910 L1040 1060 L1120 1330" stroke-width="3"/>
      <path d="M780 960 L820 960" stroke-width="5"/>
    </g>

    <!-- Deep Shadow Crevices inside Iceberg -->
    <g fill="none" stroke="#04122c" stroke-width="3.5" opacity="0.85">
      <path d="M420 1090 L560 1060 L740 1180 L800 1380"/>
      <path d="M1180 1090 L1040 1060 L860 1180 L800 1380"/>
    </g>
  </g>


  <!-- ========================================== -->
  <!-- 4. DEEP ABYSS & TAPERING GLACIER (y: 1450 to 2400) -->
  <!-- "for the night or dark version make the glacier thinner as we go down and add some random periodically glowing particles in the water that is darkish around the glacier" -->
  <!-- ========================================== -->

  <!-- GLACIER TAPERS PROGRESSIVELY DOWN INTO A SLENDER SPIRE -->
  <!-- Upper Transition to Spire (y: 1450 to 1750, narrows from 720px width down to 280px) -->
  <polygon points="
    440,1450 560,1600 660,1750
    940,1750 1040,1600 1160,1450
  " fill="url(#ice-spire)" stroke="#56d3f2" stroke-width="3"/>

  <!-- Mid Spire (y: 1750 to 2050, narrows from 280px width down to 120px) -->
  <polygon points="
    660,1750 710,1900 740,2050
    860,2050 890,1900 940,1750
  " fill="url(#ice-spire)" stroke="#3ebde0" stroke-width="2.5"/>

  <!-- Deep Keel Spire Needle (y: 2050 to 2350, narrows down to a sharp needle tip at y: 2360) -->
  <polygon points="
    740,2050 765,2200 788,2320 800,2370
    812,2320 835,2200 860,2050
  " fill="url(#ice-spire)" stroke="#229fc4" stroke-width="2"/>

  <!-- Facets on Tapering Glacier Spire -->
  <g opacity="0.6">
    <polygon points="660,1750 800,1750 775,1900 710,1900" fill="#2285b8"/>
    <polygon points="800,1750 940,1750 890,1900 825,1900" fill="#145885"/>
    <polygon points="710,1900 800,1900 780,2050 740,2050" fill="#186c99"/>
    <polygon points="800,1900 890,1900 860,2050 820,2050" fill="#0e4368"/>
    <polygon points="740,2050 800,2050 790,2200 765,2200" fill="#10557e"/>
    <polygon points="800,2050 860,2050 835,2200 810,2200" fill="#08304f"/>
    <!-- Central Ridge Spine of the Spire -->
    <path d="M800 1450 L800 1750 L800 1900 L800 2050 L800 2200 L800 2370" stroke="#77e5ff" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <!-- Deep Crepuscular Beams in Dark Water -->
  <g fill="none" stroke="#26c2e8" opacity="0.04" stroke-linecap="round">
    <path d="M720 1450 L640 2350" stroke-width="40"/>
    <path d="M880 1450 L960 2350" stroke-width="40"/>
  </g>

  <!-- ========================================== -->
  <!-- 5. PERIODICALLY GLOWING BIOLUMINESCENT PARTICLES AROUND THE GLACIER (Darkish Water) -->
  <!-- ========================================== -->
  <g filter="url(#bio-glow)">
    <!-- Cyan & Electric Blue Bioluminescent Clusters around Upper/Mid Glacier -->
    <circle cx="280" cy="980" r="4.5" fill="#58e8ff" opacity="0.85"/>
    <circle cx="210" cy="1120" r="3.5" fill="#88f2ff" opacity="0.75"/>
    <circle cx="340" cy="1280" r="5" fill="#46dcff" opacity="0.9"/>
    <circle cx="1380" cy="990" r="4" fill="#6ce9ff" opacity="0.85"/>
    <circle cx="1460" cy="1140" r="3.5" fill="#8ff4ff" opacity="0.8"/>
    <circle cx="1290" cy="1290" r="5" fill="#42d8ff" opacity="0.9"/>

    <!-- Bioluminescent Spores along the Tapering Glacier into the Dark Abyss -->
    <!-- Left Dark Water -->
    <circle cx="480" cy="1580" r="4.5" fill="#52e2ff" opacity="0.8"/>
    <circle cx="390" cy="1720" r="3.5" fill="#75ecff" opacity="0.7"/>
    <circle cx="520" cy="1860" r="4" fill="#3bd4f7" opacity="0.85"/>
    <circle cx="430" cy="2020" r="3.5" fill="#6de8ff" opacity="0.75"/>
    <circle cx="580" cy="2140" r="4.5" fill="#3cd5f8" opacity="0.8"/>
    <circle cx="670" cy="2260" r="3" fill="#84f0ff" opacity="0.9"/>
    <circle cx="540" cy="2320" r="3.5" fill="#45d8fa" opacity="0.7"/>

    <!-- Right Dark Water -->
    <circle cx="1120" cy="1580" r="4" fill="#56e4ff" opacity="0.85"/>
    <circle cx="1210" cy="1730" r="3.5" fill="#7deeff" opacity="0.7"/>
    <circle cx="1080" cy="1880" r="4.5" fill="#3cd5f8" opacity="0.85"/>
    <circle cx="1170" cy="2040" r="3" fill="#69e7ff" opacity="0.75"/>
    <circle cx="1020" cy="2150" r="4" fill="#38d3f6" opacity="0.8"/>
    <circle cx="930" cy="2270" r="3.5" fill="#7ff0ff" opacity="0.9"/>
    <circle cx="1060" cy="2330" r="3" fill="#43d7f9" opacity="0.7"/>

    <!-- Close Proximal Deep-Sea Organisms along Spire Spine -->
    <circle cx="710" cy="1820" r="3" fill="#99f5ff" opacity="0.85"/>
    <circle cx="890" cy="1840" r="3" fill="#99f5ff" opacity="0.85"/>
    <circle cx="730" cy="1980" r="2.5" fill="#b3f8ff" opacity="0.9"/>
    <circle cx="870" cy="2000" r="2.5" fill="#b3f8ff" opacity="0.9"/>
    <circle cx="755" cy="2150" r="3" fill="#94f4ff" opacity="0.95"/>
    <circle cx="845" cy="2170" r="3" fill="#94f4ff" opacity="0.95"/>
    <circle cx="780" cy="2280" r="2.5" fill="#cbfaff" opacity="0.9"/>
    <circle cx="820" cy="2300" r="2.5" fill="#cbfaff" opacity="0.9"/>
    <circle cx="800" cy="2385" r="3.5" fill="#88f2ff" opacity="0.95"/>
  </g>
</svg>
